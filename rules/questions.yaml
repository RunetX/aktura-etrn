# Вопросы пошагового опросника (бриф §6: режим без ИИ).
# Ключи фактов и значения — только из VOCABULARY.md (проверяется тестом quiz).
# Порядок в списке = порядок, в котором опросник задаёт вопросы. Опросник спрашивает только то,
# чего движку не хватает (Result.Ask), а когда сценарий выбран — уточнения (Result.Pending).
# К каждому вопросу автоматически добавляется вариант «Не знаю» (значение unknown).
# group — вопрос с галочками: отмеченное = yes, остальное = no.
# ai_exclude — варианты, которые ИИ не выбирает (их отвечает только человек).
# ai — указание ИИ-слою (этап 3), как узнавать ответ в описании; ai: skip — ИИ этот вопрос
# не заполняет никогда, его всегда задаёт опросник (условия договоров, исключения, где цена
# ошибки высока, а в пересказе они почти не звучат однозначно).

version: 0.5
date: 2026-09-30

questions:

  - fact: international
    ai: "yes — только если названы пункты в разных странах; no — только если прямо сказано, что перевозка по России или между российскими городами."
    text: "Куда везут груз?"
    hint: "Важно, что записано в договоре перевозки: если место приёма груза и место сдачи — в разных странах, это международная перевозка по международному договору (КДПГ ст. 1). Если на участок по России заключён отдельный договор, он внутренний."
    options:
      - { value: "no", label: "По России (по отдельному договору на этот участок)" }
      - { value: "yes", label: "В другую страну или из другой страны, одним договором (в т. ч. ЕАЭС)" }
      - { value: ru_via_foreign, label: "Из России в Россию через другую страну (например, в Калининград через Литву)" }

  - fact: transport
    ai_exclude: [own_company, tk]  # own_company ИИ путает с «развозит своим клиентам»; tk — вид договора ИИ не определит; только опросник
    ai: "forwarder — если в перевозке участвует экспедитор, транспортно-экспедиционная компания (ТЭК) или «ТК-экспедитор», даже если он нанял перевозчика. hired_carrier — перевозчика (ТК, ИП) нанял продавец, покупатель или сама организация, без экспедитора; «покупатель заказывает перевозку» — это тоже hired_carrier. own_buyer — только если покупатель везёт СВОИМ транспортом. own_seller — продавец (поставщик, магазин) развозит товар покупателям или клиентам своим транспортом. Перевозка между своими складами и филиалами — пропусти вопрос. Если продавец (владелец товара) развозит товар клиентам или покупателям своим транспортом — это own_seller. Если компания по договору с владельцем груза везёт ЧУЖОЙ груз (хранит, грузит, доставляет) — это не own_seller: forwarder, если это логистическая или экспедиторская компания, иначе hired_carrier. Если в описании сам перевозчик (ИП, самозанятый) возит чужие грузы по договорам — это hired_carrier."
    text: "Кто везёт груз?"
    hint: "Главное — есть ли договор перевозки со сторонним перевозчиком. Если груз везёт его владелец своим транспортом, договора перевозки нет и транспортная накладная не нужна (Устав ст. 2 ч. 1 п. 20). Масса и тип машины на это не влияют. Если путь из нескольких частей (например, своей машиной до терминала ТК, дальше везёт ТК), ответьте про одну часть, про другую пройдите опрос ещё раз: своим транспортом до терминала — отдельный участок без договора перевозки."
    options:
      - { value: own_seller, label: "Продавец своим транспортом" }
      - { value: own_buyer, label: "Покупатель своим транспортом (самовывоз)" }
      - { value: own_company, label: "Организация своим транспортом между своими складами или филиалами" }
      - { value: tk, label: "Транспортная компания (ТК): сдаём груз на терминал или отдаём курьеру ТК" }
      - { value: hired_carrier, label: "Нанятый перевозчик (ИП или компания, везёт по договору перевозки)" }
      - { value: forwarder, label: "Экспедитор (организует перевозку по договору экспедиции)" }
      - { value: rented_with_crew, label: "Своя машина, арендованная с экипажем (водителем)" }
      - { value: no_contract, label: "Без договора перевозки: сотрудник на личной машине, ручная кладь" }

  - fact: tk_contract
    ai: "skip"
    text: "Договор с транспортной компанией — перевозка или транспортная экспедиция?"
    hint: "Решают признаки договора, а не его название (Пленум ВС РФ № 26 п. 26). Экспедиция — если в договоре или оферте ТК «транспортная экспедиция», ТК оформляет поручение экспедитору и экспедиторскую расписку. Перевозка — если ТК сама везёт как перевозчик по договору перевозки. Не уверены — посмотрите договор или оферту на сайте ТК: все шесть публичных оферт крупных ТК, проверенных 25.09.2026, — договоры транспортной экспедиции (это наблюдение, не норма; смотрите дату редакции)."
    options:
      - { value: forwarding, label: "Транспортная экспедиция (есть поручение экспедитору, экспедиторская расписка)" }
      - { value: carriage, label: "Перевозка (ТК — перевозчик по договору перевозки)" }

  - fact: carriage_customer
    ai_exclude: [company]  # «наша организация везёт себе же» ИИ путает с любой «компанией» — только опросник
    ai: "Кто заключил договор с перевозчиком (выдал заявку). Магазин, продающий товар, — seller. other — только агент, дилер, комиссионер, заключивший договор перевозки."
    text: "Кто заключил договор с перевозчиком — выдал ему заказ или заявку?"
    hint: "Грузоотправитель — тот, кто по договору перевозки выступает от своего имени (Устав ст. 2 ч. 1 п. 4). Кто платит и кому принадлежит груз — роли не определяет."
    options:
      - { value: seller, label: "Продавец (поставщик)" }
      - { value: buyer, label: "Покупатель" }
      - { value: company, label: "Наша организация — груз везём себе же (между своими складами)" }
      - { value: forwarder, label: "Экспедитор" }
      - { value: other, label: "Посредник: агент, дилер, комиссионер" }

  - fact: seller_paid_delivery
    ai: "Только если продавец везёт своим транспортом."
    text: "Продавец везёт своим транспортом. Доставка оплачивается отдельно от товара?"
    hint: "Например, строка «доставка» в счёте или УПД, отдельный тариф. Если доставка входит в цену товара, это исполнение договора поставки."
    options:
      - { value: "no", label: "Нет, доставка входит в цену товара" }
      - { value: "yes", label: "Да, доставка оплачивается отдельно" }

  - fact: ownership_before_delivery
    ai: "Только если прямо сказано, когда переходит право собственности."
    text: "Право собственности на товар переходит к покупателю ещё до доставки — при отгрузке?"
    hint: "Смотрите договор поставки: момент перехода права собственности. Если товар уже принадлежит покупателю, продавец везёт чужой груз."
    options:
      - { value: "no", label: "Нет, после доставки" }
      - { value: "yes", label: "Да, при отгрузке" }

  - fact: forwarder_own_vehicles
    ai: "Только если участвует экспедитор: yes — везёт своими машинами, no — нанял перевозчика."
    text: "Экспедитор везёт груз сам, своим транспортом?"
    hint: "Или нанимает стороннего перевозчика. Для транспортной компании это можно узнать только у неё: от ответа зависит, кто грузоотправитель в ЭТрН (если ТК везёт сама — спорный случай)."
    options:
      - { value: "no", label: "Нет, нанимает перевозчика" }
      - { value: "yes", label: "Да, своим транспортом" }

  - fact: forwarder_takes_possession
    ai: "Только если прямо сказано, принимает ли экспедитор груз (выдаёт ли экспедиторскую расписку)."
    text: "Экспедитор принимает груз во владение — выдаёт экспедиторскую расписку?"
    hint: "Приняв груз, экспедитор заключает договор перевозки только от своего имени и становится грузоотправителем; не принимая — только от имени клиента (87-ФЗ ст. 4 п. 4.1)."
    options:
      - { value: "yes", label: "Да, принимает груз, выдаёт расписку" }
      - { value: "no", label: "Нет, только организует перевозку" }

  - fact: intermediary_acts_in
    ai: "Только если прямо сказано, от чьего имени посредник заключил договор перевозки."
    text: "Посредник заключил договор с перевозчиком от своего имени или от имени клиента?"
    hint: "Агент от своего имени сам становится стороной сделки; от имени принципала — сторона сам принципал (ГК ст. 1005 п. 1). Смотрите, кто указан заказчиком в заявке перевозчику."
    options:
      - { value: own_name, label: "От своего имени" }
      - { value: principal_name, label: "От имени клиента (принципала)" }

  - fact: tmc_accounting
    ai: "skip"
    text: "По грузу ведётся учёт движения товарно-материальных ценностей?"
    hint: "Обычно да: товары, сырьё, материалы. Если учёта нет, перевозят по договору фрахтования, а не по транспортной накладной (Устав ст. 8 ч. 3, ст. 18 ч. 1)."
    options:
      - { value: "yes", label: "Да" }
      - { value: "no", label: "Нет" }

  - fact: owner_escort
    ai: "skip"
    text: "Груз сопровождает представитель грузовладельца?"
    hint: "Если да — это договор фрахтования, а не перевозка по транспортной накладной (Устав ст. 8 ч. 3, ст. 18 ч. 1)."
    options:
      - { value: "no", label: "Нет" }
      - { value: "yes", label: "Да" }

  - fact: loader
    ai: "Кто фактически грузит. seller — продавец (поставщик), в т. ч. на своём заводе или складе. warehouse — склад или завод третьего лица (не продавца), СВХ, склад ответственного хранения."
    text: "Кто грузит груз в машину?"
    hint: "Лицо, осуществляющее погрузку, вправе подписать файл грузоотправителя (титул 1) — ПП 931 прил. 1 п. 3 «а». Грузит грузоотправитель, если договором перевозки не предусмотрено иное; погрузка может быть и за перевозчиком (Устав ст. 11 ч. 8, 11) — например, ТК грузит сама на своём терминале."
    options:
      - { value: shipper, label: "Сам грузоотправитель" }
      - { value: seller, label: "Продавец (поставщик) на своём складе" }
      - { value: warehouse, label: "Сторонний склад или завод третьего лица" }
      - { value: carrier, label: "Перевозчик (например, ТК грузит сама на своём терминале)" }

  - fact: consignee_party
    ai: "Кому перевозчик фактически везёт и выдаёт груз — относительно того, кто заказал перевозку. customer_buyer — перевозку заказал продавец, а груз получает его покупатель. customer_itself — груз получает тот же, кто заказал перевозку (например, покупатель сам нанял перевозчика и сам получает груз). Не определяй по тому, кто записан грузополучателем в ЭТрН."
    text: "Кому перевозчик выдаёт груз?"
    hint: "Грузополучатель — лицо, управомоченное на получение груза по договору перевозки (Устав ст. 2 ч. 1 п. 5), а не обязательно покупатель."
    options:
      - { value: customer_buyer, label: "Покупателю заказчика перевозки" }
      - { value: customer_itself, label: "Самому заказчику (клиенту экспедитора) или его подразделению" }
      - { value: third_party, label: "Другому лицу по указанию заказчика (клиенту покупателя, подрядчику)" }
      - { value: shipper_itself, label: "Самому грузоотправителю (например, экспедитор везёт на свой склад)" }
      - { value: terminal, label: "На терминал другой транспортной компании или службы доставки" }

  - fact: receiver_representative
    ai: "skip"
    text: "Кто принимает груз на выгрузке — сам грузополучатель или другая организация по его поручению?"
    hint: "Грузополучатель — тот, кто по договору перевозки управомочен получить груз (Устав ст. 2 ч. 1 п. 5), он указан в накладной. Если грузополучателем указан сам склад (3PL), он и есть грузополучатель — ответьте «Сам грузополучатель». Если склад, 3PL или другая фирма только принимает груз за грузополучателя, это его представитель: титул 3 подписывается от имени грузополучателя по доверенности."
    options:
      - { value: "no", label: "Сам грузополучатель" }
      - { value: "yes", label: "Другая организация по его поручению (склад, 3PL)" }

  - group: exceptions
    ai: "skip"
    text: "Отметьте, если что-то из этого относится к вашей перевозке"
    hint: "Случаи, когда транспортная накладная может быть на бумаге (приказ Минтранса № 262 в ред. № 391). ЭТрН в этих случаях тоже можно, если так сказано в договоре перевозки. Если ничего не подходит — просто продолжите."
    options:
      - fact: exc_individual_personal
        label: "Грузоотправитель — гражданин (не ИП), груз для личных нужд"
        hint: "Гражданин сам заключил договор перевозки (нанял перевозчика), груз — для личных, семейных, домашних нужд, не для бизнеса (приказ № 262 п. 4). ИП и покупки для бизнеса сюда не относятся."
      - fact: exc_individual_consignee
        label: "Гражданин (не ИП) — только грузополучатель, груз для его личных нужд; перевозку заказал продавец или другое лицо"
        hint: "Например, интернет-магазин везёт заказ покупателю. По тексту п. 4 приказа № 262 («грузоотправителем и (или) грузополучателем») хватает того, что гражданин — грузополучатель, и Верховный суд в споре о доставке покупателю указал, что услуга оказывается ему. Но разъяснений Минтранса нет, и есть прочтение, что исключение — только для гражданина-заказчика. Итог — спорно."
      - fact: exc_foreign_unaccredited
        label: "Грузоотправитель или грузополучатель — иностранная компания без аккредитованного филиала или представительства в России"
        hint: "Проверьте компанию в реестре аккредитованных филиалов и представительств на сайте ФНС: service.nalog.ru/rafp (бесплатно). Записи нет — случай ваш. Есть действующая аккредитация — по тексту приказа исключения нет. Аккредитация прекращена — не разъяснено."
      - { fact: exc_eaeu_cabotage, label: "Перевозчик — иностранный, из страны ЕАЭС (каботаж)" }
      - { fact: exc_mod, label: "Военный груз, грузоотправитель или грузополучатель — Минобороны, МВД, Росгвардия, ФСБ, МЧС, СВР или ФСО" }
      - fact: exc_emergency_regime
        label: "На территории перевозки режим ЧС, повышенной готовности, ЧП, военное положение или КТО"
        hint: "Режим ЧС или повышенной готовности вводят Правительство, органы власти региона или муниципалитета, чрезвычайное положение — Президент указом. Найдите акт «О введении режима…» (publication.pravo.gov.ru, сайт региона) и проверьте, что его не отменили. Режимы повышенной готовности 2020 года в Москве, Московской области и Санкт-Петербурге формально не отменены; даёт ли это право на бумагу по всему региону — спорно. Не разъяснено: хватает ли, что в зоне режима только часть маршрута; считается ли режим, введённый на предприятии или в части города. Военное положение и КТО здесь не разбираются."
      - { fact: exc_special_cargo, label: "Специальный груз (257-ФЗ ст. 3 п. 23)" }
      - fact: exc_periodicals
        label: "Периодические печатные издания"
        hint: "Газета, журнал, альманах, бюллетень или иное издание с постоянным названием и текущим номером, выходящее не реже раза в год (Закон о СМИ ст. 2). Книги сюда не относятся."
      - { fact: exc_military_dual_export, label: "Продукция военного или двойного назначения во внешней торговле" }
      - { fact: exc_precious, label: "Драгоценные металлы или камни" }
      - { fact: exc_no_internet, label: "Нет доступа к интернету (в т. ч. населённый пункт из распоряжения № 1855-р)" }
      - fact: exc_gossopka_failure
        label: "Сбой информационных систем, зафиксированный ГосСОПКА"
        hint: "Обычный сбой у оператора ЭДО сюда не относится: нужен сбой, зафиксированный ГосСОПКА. Открытого реестра таких сбоев нет; справка оператора о нештатной ситуации фиксацию ГосСОПКА не подтверждает."

  - fact: etrn_in_contract
    ai: "skip"
    text: "В договоре перевозки сказано, что накладная оформляется в электронном виде?"
    hint: "В случаях приказа № 262 бумага — право, а не обязанность: если договор предусматривает ЭТрН, оформляется ЭТрН (Устав ч. 1 ст. 8 в ред. 302-ФЗ)."
    options:
      - { value: "no", label: "Нет или не сказано" }
      - { value: "yes", label: "Да" }

  # ---------- Экспедиторские документы: только при экспедиторе ----------

  - fact: fwd_storage
    ai: "skip"
    text: "Экспедитор принимает груз на складское хранение?"
    hint: "При приёме груза на складское хранение экспедитор выдаёт ещё и складскую расписку (87-ФЗ ст. 4 п. 4.1)."
    options:
      - { value: "no", label: "Нет" }
      - { value: "yes", label: "Да, груз хранится у экспедитора на складе" }

  - group: fwd_exceptions
    ai: "skip"
    text: "Отметьте, если что-то из этого относится к услугам экспедитора"
    hint: "Случаи, когда экспедиторские документы можно оформить на бумаге (приказ Минтранса № 115). Электронно в этих случаях тоже можно, если так сказано в договоре экспедиции. Если ничего не подходит — просто продолжите."
    options:
      - { fact: exc_fwd_consumer, label: "Клиент экспедитора — физлицо, услуги для личных нужд" }
      - { fact: exc_fwd_foreign_client, label: "Клиент экспедитора — иностранная компания или иностранец" }
      - { fact: exc_fwd_state_needs, label: "Грузы для нужд органов власти, обороны, безопасности, правопорядка; специальные или воинские грузы" }
      - { fact: exc_fwd_emergency_regime, label: "На территории оказания услуг режим ЧС, повышенной готовности, ЧП, военное положение или КТО" }
      - { fact: exc_fwd_force_majeure_client, label: "У клиента из-за непреодолимой силы нет возможности передать электронный документ через интернет" }
