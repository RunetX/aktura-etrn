  - id: R-007
    layer: roles
    title: Экспедитор принимает груз во владение
    when:
      any:
        - { transport: forwarder, forwarder_own_vehicles: no }
        - { transport: hired_carrier, carriage_customer: forwarder }
      forwarder_takes_possession: yes
      international: no
      tmc_accounting: yes
      owner_escort: no
    then:
      carriage_doc: etrn
      roles: { shipper: forwarder, forwarder_client: client, consignee: buyer, carrier: carrier, loader: shipper }
      forwarder_mark: true
      signs: standard
    certainty: clear
    sources:
      - act: "87-ФЗ, ст. 4 п. 4.1 подп. 1 (в ред. 140-ФЗ): груз экспедитором принимается"
        quote: "от имени клиента по доверенности (за исключением договоров перевозки и хранения) или от своего имени"
        url: *fz87
        checked: 2026-09-23
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 4"
        quote: "грузоотправитель - физическое или юридическое лицо, которое по договору перевозки груза выступает от своего имени или от имени владельца груза"
        url: *ustav
        checked: 2026-09-23
      - act: "Пленум ВС РФ от 26.06.2018 № 26, п. 27"
        quote: "Если же договор перевозки груза заключен экспедитором от своего имени, правом требовать […] обладает экспедитор."
        url: *plenum26
        checked: 2026-09-23
      - act: "Формат ЭТрН (приказ ФНС № ЕД-7-26/1065@), табл. 5.5: ГОЭксп"
