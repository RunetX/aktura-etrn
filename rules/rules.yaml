      - act: "Устав, ст. 8 ч. 3"
        quote: "Груз, на который не оформлена транспортная накладная, перевозчиком для перевозки не принимается, за исключением груза, указанного в части 1 статьи 18"
        url: *ustav
        checked: 2026-09-23
    notes: "Вместо ТрН — договор фрахтования (обычно заказ-наряд, ПП 2200 п. 15), бумажный или электронный. Кто и что подписывает в заказ-наряде — вне объёма помощника (PARKING)."

  - id: R-010
    layer: roles
