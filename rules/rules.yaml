        url: *fmt
        checked: 2026-09-23
    notes: "Приняв груз, экспедитор вправе заключить договор перевозки только от своего имени (87-ФЗ) → он сторона договора и грузоотправитель (Устав). В ЭТрН: ГОЭксп = 1, клиент — в блоке СвЗак. До 01.09.2026 то же прямо говорил ПП 2200 п. 102; Минтранс — Q&A 4.8. Если экспедитор везёт своим транспортом — R-016. Если груз — собственный груз клиента, который он же получает (consignee_party: customer_itself), ГО (экспедитор) и ГП (клиент) — разные лица, исключение приказа № 262 п. 7 не срабатывает: ГО — сторона договора перевозки (Устав ст. 2 ч. 1 п. 4; Пленум № 26 пп. 27–28), клиент в ЭТрН — заказчик `СвЗак` (QUESTIONS №27)."
  - id: R-008
    layer: roles
    title: Экспедитор организует перевозку, груз во владение не принимает
    when:
