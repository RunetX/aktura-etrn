# Справочник: кто подписывает файлы ЭТрН (ПП 931, прил. 1, п. 3). Номера Т1–Т8 — формат ФНС 5.01.
titles:
  source:
    act: "ПП РФ от 21.05.2022 № 931, прил. 1, п. 3 (в ред. ПП 476)"
    url: *pp931
    checked: 2026-09-23
  signature: "УКЭП или УНЭП (Госключ физлица, в т. ч. по доверенности) — Устав ст. 18.1 ч. 1 п. 2; ГП-физлицо — ПЭП"
  templates:
    standard:
      - { title: T1, file: "информация грузоотправителя", signs: shipper }
      - { title: T2, file: "прием груза перевозчиком", signs: carrier, driver_optional: "ПЭП или УНЭП водителя, затем подпись перевозчика" }
      - { title: T3, file: "информация грузополучателя", signs: consignee }
      - { title: T4, file: "выдача груза перевозчиком", signs: carrier, driver_optional: "ПЭП или УНЭП водителя, затем подпись перевозчика" }
      - { title: T5, file: "стоимость перевозки", signs: carrier }
      - { title: T6, file: "подтверждение стоимости", signs: shipper }
      - { title: null, file: "указание о переадресовке (опционально)", signs: shipper, note: "ПП 931 прил. 1 п. 3 «д», п. 13 — отдельный файл ГО; в формате 5.01 отдельного файла нет: указание ГО (или ГП, если ГО передал ему полномочия — `ЛицоПА`, `ДокПерПолнПА`) отражается реквизитами `ОснПА` и подписью `ЭПУвПА` в файле перевозчика ON_TRNPEREADR (КНД 1110343). QUESTIONS №5" }
      - { title: T7, file: "переадресовка", signs: carrier }
      - { title: T8, file: "замена водителя и (или) ТС", signs: carrier }
    loader_signs_t1:
      extends: standard
      override:
        - { title: T1, signs: loader, note: "ПП 931 прил. 1 п. 3 «а»: файл ГО вправе подписать лицо, осуществляющее погрузку" }
  # Поправки к шаблону сценария (слой signers): строка с тем же титулом заменяется непустыми полями.
  patches:
    consignee_by_proxy:
      - title: T3
        signs: consignee_proxy
        on_behalf: consignee
        detail: "Грузополучатель в накладной тот же: Т3 подписывается от его имени. Подписывает представитель (его руководитель или работник) по доверенности грузополучателя; если доверенность работнику выдана в порядке передоверия, нужна и доверенность грузополучателя с правом передоверия. Надёжнее машиночитаемая доверенность: допустима ли бумажная, закон однозначно не говорит."
        note: "Формат 5.01, Т3: подписант — физлицо; `СтатПодп` = 2 — по электронной доверенности (тогда `СвДовер` или `ИдСистХран`), 3 — по бумажной, «если иное не предусмотрено законодательством… в области электронной подписи» (табл. 13.9). Если файл составляет не сам грузополучатель (например, склад) — `НаимЭконСубСост` и `ОснДоверОргСост` (табл. 13.2). Элемента «организация-представитель» у подписанта нет. ПП 931 машиночитаемую доверенность в ГИС не требует (требует проект изменений ПП 931 — не норма). В классификаторе полномочий МЧД (ЕСНСИ № 9532, справочно, не НПА) отдельного полномочия на титулы ЭТрН нет; ближайшее — BBDOCS_DOCS_DCSALL_SRCDOC_SOURCEDOCS8 «Подписывать транспортные накладные»."

notes:
  N-MASS:
    text: "Масса и тип ТС не влияют на обязанность оформлять ЭТрН: она зависит от договора перевозки. Масса важна для реестра перевозчиков (520-ФЗ)."
    sources:
      - act: "Ответы Минтранса по ГИС ЭПД, раздел 2, вопрос 3 (разъяснение)"
        quote: "Ограничение по массе относится к допуску по Федеральному закону № 520-ФЗ, а не к обязанности оформлять транспортную накладную."
        url: *qa_auto
        checked: 2026-09-23

  N-SELFEMP:
    text: "Исполнитель — физлицо без статуса ИП (самозанятый). Перевозчиком по Уставу может быть только юрлицо или ИП; предпринимательство без регистрации — штраф исполнителю; с 01.03.2027 перевозка на ТС тяжелее 3,5 т без допуска не допускается, допуск — только юрлицу или ИП. Является ли такой договор договором перевозки и нужна ли ЭТрН — прямой нормы нет. ИП на НПД перевозчиком быть может (с ограничениями 422-ФЗ: без наёмных работников)."
    sources:
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 13"
        quote: "перевозчик - юридическое лицо, индивидуальный предприниматель, принявшие на себя по договору перевозки"
        url: *ustav
        checked: 2026-09-23
      - act: "КоАП РФ, ст. 14.1 ч. 1"
        quote: "Осуществление предпринимательской деятельности без государственной регистрации в качестве индивидуального предпринимателя"
        url: https://www.consultant.ru/document/cons_doc_LAW_34661/75bd42f831f7b882297cf0c477ced1e5dcfc89f2/
        checked: 2026-09-23
      - act: "520-ФЗ, ст. 3 ч. 1, 4 (с 01.03.2027; ст. 1 ч. 4 — не для ТС до 3,5 т)"
        quote: "при отсутствии допуска к предоставлению услуг по перевозкам грузов не допускается"
        url: *f520
        checked: 2026-09-23
  N-SHAM:
    text: "Если «ГО = ГП» создано искусственно (например, аренда склада у покупателя, чтобы везти груз «к себе» и оформить бумагу), сделки, совершённые для вида или чтобы прикрыть другую сделку, ничтожны; к прикрываемой применяются её правила, в т. ч. для цепочки сделок (Пленум ВС № 25 пп. 86–88). Суд вправе применить последствия по своей инициативе; налоговый орган переквалифицирует сделку через суд (НК ст. 45 п. 3, ст. 54.1). Практики именно по ЭТрН нет. Помощник схемы не оценивает, только предупреждает."
    sources:
      - act: "ГК РФ, ст. 170 п. 2"
        quote: "Притворная сделка, то есть сделка, которая совершена с целью прикрыть другую сделку"
        url: https://www.consultant.ru/document/cons_doc_LAW_5142/4721eaf980204a7ee93eb51b30688e14998af84a/
        checked: 2026-09-23
      - act: "ГК РФ, ст. 10 п. 1"
        quote: "Не допускаются […] действия в обход закона с противоправной целью"
        url: https://www.consultant.ru/document/cons_doc_LAW_5142/62129e15ab0e6008725f43d63284aef0bb12c2cf/
        checked: 2026-09-23

rules:

  # ---------- Слой roles: сценарий ----------

  - id: R-001
    layer: roles
    title: Продавец везёт свой груз своим транспортом, доставка входит в цену
    when:
      transport: own_seller
      seller_paid_delivery: no
      ownership_before_delivery: no
      international: no
    then:
      carriage_doc: none
      roles: { shipper: none, consignee: none, carrier: none }
    certainty: clear
    sources:
      - act: "ГК РФ, ст. 785 п. 1"
        quote: "перевозчик обязуется доставить вверенный ему отправителем груз […], а отправитель обязуется уплатить за перевозку груза установленную плату"
        url: *gk785
        checked: 2026-09-23
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 20"
        quote: "транспортная накладная - перевозочный документ, подтверждающий заключение договора перевозки груза"
        url: *ustav
        checked: 2026-09-23
      - act: "Пленум ВС РФ от 26.06.2018 № 26, п. 3"
        quote: "перевозка для собственных нужд"
        url: *plenum26
        checked: 2026-09-23
      - act: "Ответы Минтранса по ГИС ЭПД, раздел 2, вопрос 4 (разъяснение)"
        quote: "Нет, так как договор перевозки в этом случае не может быть заключен между одним и тем же лицом"
        url: *qa_auto
        checked: 2026-09-23
    notes: "Договор перевозки двусторонний (ГК 785): продавец не может перевозить сам для себя, ТрН подтверждать нечего. Иная, более старая позиция — Минфин, письмо от 22.12.2011 № 03-03-10/123: при доставке продавцом «возникают… отношения при оказании услуг по перевозке». Текущая позиция Минтранса (2026) и практика (ФАС ЦО, А64-11624/05-13) — против неё."
  - id: R-002
    layer: roles
    title: Самовывоз покупателем своим транспортом
    when:
      transport: own_buyer
      international: no
    then:
      carriage_doc: none
      roles: { shipper: none, consignee: none, carrier: none }
    certainty: clear
    sources:
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 20"
        quote: "транспортная накладная - перевозочный документ, подтверждающий заключение договора перевозки груза"
        url: *ustav
        checked: 2026-09-23
      - act: "Ответы Минтранса по ГИС ЭПД, раздел 2, вопрос 4 (разъяснение)"
        quote: "Нет, так как договор перевозки в этом случае не может быть заключен между одним и тем же лицом"
        url: *qa_auto
        checked: 2026-09-23
    notes: "Пример из брифа (там он назван R-017; к правилу R-017 этой базы не относится). Отгрузочные документы по договору поставки — отдельный вопрос, помощник его не решает."

  - id: R-003
    layer: roles
    title: Продавец нанимает перевозчика и доставляет покупателю
    when:
      transport: hired_carrier
      carriage_customer: seller
      international: no
      tmc_accounting: yes
      owner_escort: no
    then:
      carriage_doc: etrn
      roles: { shipper: seller, consignee: buyer, carrier: carrier, loader: shipper }
      signs: standard
    certainty: clear
    sources:
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 4"
        quote: "грузоотправитель - физическое или юридическое лицо, которое по договору перевозки груза выступает от своего имени или от имени владельца груза"
        url: *ustav
        checked: 2026-09-23
      - act: "140-ФЗ, ст. 4 п. 2 «а» — ч. 1 ст. 8 Устава (с 01.09.2026)"
        quote: "Транспортная накладная формируется в виде электронной транспортной накладной."
        url: *fz140
        checked: 2026-09-23
      - act: "АС Дальневосточного округа, постановление от 23.10.2017 № Ф03-2948/2017 по делу № А51-6666/2016 (поставщик, организующий перевозку, — не экспедитор)"
        quote: "является согласованным сторонами способом исполнения обязанности по передаче (поставке) товара покупателю и не может свидетельствовать о заключении сторонами договора об оказании транспортно-экспедиционных услуг"
        url: *asdvo2017
        checked: 2026-09-24
      - act: "АС Московского округа, постановление от 19.08.2025 № Ф05-12706/2025 по делу № А41-5888/2024 (признак экспедиции — экспедиторские документы)"
        quote: "в отличие от договора поставки (в том числе предусматривающего транспортировку груза) по договору транспортной экспедиции обязательно составление документов, предусмотренных пунктом 5 Правил"
        url: *asmo2025
        checked: 2026-09-24
      - act: "АС Западно-Сибирского округа, постановление от 20.04.2026 № Ф04-115/2026 по делу № А70-4933/2025 (собственность перешла при сдаче перевозчику, доставка — сверх цены)"
        quote: "правоотношения сторон договора поставки по доставке товаров покупателю являются частью отношений по поставке товаров и не могут быть квалифицированы как отдельные транспортные/экспедиционные правоотношения"
        url: *aszso2026
        checked: 2026-09-24
    notes: "Минтранс (раздел 4, вопрос 6): если груз уже принадлежит покупателю, отношения «могут быть квалифицированы» как экспедиция — тогда роли по R-007/R-008. Против — практика судов округов (все дела — ж/д поставки, ст. 509, 510 ГК): АС ДВО Ф03-2948/2017 — поставщик организовывал перевозку «от своего имени за вознаграждение, по поручению и за счет покупателя», и всё же это поставка; АС МО Ф05-12706/2025 — экспедиция подтверждается экспедиторскими документами (ПП 554 п. 5), без них это поставка; АС ЗСО Ф04-115/2026 — при «франко-вагон» собственность переходит при сдаче перевозчику, доставка оплачивается сверх цены, и это всё равно часть поставки. Оговорка: в Ф04-115/2026 акты отменены и дело направлено на новое рассмотрение — вывод дан условно («если исходить из содержания условий»), квалификацию велено установить по всему механизму отношений участников. Уточнять у пользователя, если в договоре доставка оформлена как отдельная экспедиторская услуга (поручение, расписка)."

  - id: R-004
    layer: roles
    title: Самовывоз наёмным перевозчиком по договору покупателя
    when:
      transport: hired_carrier
      carriage_customer: buyer
      international: no
      tmc_accounting: yes
      owner_escort: no
    then:
      carriage_doc: etrn
      roles: { shipper: buyer, consignee: buyer, carrier: carrier, loader: seller }
      signs: loader_signs_t1
    certainty: clear
    sources:
      - act: "Устав автомобильного транспорта (259-ФЗ), ст. 2 ч. 1 п. 4"
        quote: "грузоотправитель - физическое или юридическое лицо, которое по договору перевозки груза выступает от своего имени или от имени владельца груза"
        url: *ustav
        checked: 2026-09-23
      - act: "ГК РФ, ст. 785 п. 1"
        quote: "а отправитель обязуется уплатить за перевозку груза установленную плату"
        url: *gk785
        checked: 2026-09-23
      - act: "Пленум ВС РФ от 26.06.2018 № 26, п. 28"
        quote: "Лицом, отвечающим перед фактическим перевозчиком за оплату перевозки, является лицо, заключившее договор перевозки."
        url: *plenum26
        checked: 2026-09-23
      - act: "ПП РФ № 931, прил. 1, п. 3 «а»"
        quote: "грузоотправителя (лица, уполномоченного на подписание электронной транспортной накладной от имени грузоотправителя, или лица, осуществляющего погрузку груза в транспортное средство)"
        url: *pp931
        checked: 2026-09-23
    notes: "Грузоотправитель — покупатель: он сторона договора перевозки и платит за неё. Нормы, которая делала бы грузоотправителем поставщика, не найдено. Возражение: ПП 554 п. 4 определяет грузоотправителя как «лицо, предъявившее груз к перевозке», но только для экспедиции. Т1 подписывает покупатель или поставщик как лицо, осуществляющее погрузку. ГО = ГП → R-107 (приказ № 262 п. 7): бумага допустима, ЭТрН — если предусмотрена договором. Аналогия — письмо Минтранса от 26.03.2021 № Д3/6976-ИС: ГО — сторона, обязанная оплатить перевозку."
  - id: R-005
    layer: roles
    title: Перемещение между подразделениями своим транспортом
    when:
      transport: own_company
      international: no
    then:
      carriage_doc: none
      roles: { shipper: none, consignee: none, carrier: none }
    certainty: clear
    sources:
      - act: "Ответы Минтранса по ГИС ЭПД, раздел 2, вопрос 7 (разъяснение)"
        quote: "Нет, если перевозка осуществляется собственным транспортом и договор перевозки груза не заключается."
        url: *qa_auto
