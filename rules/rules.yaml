        url: *plenum26
        checked: 2026-09-23
    notes: "Без приёма груза экспедитор заключает договор перевозки от имени клиента → грузоотправитель — клиент (продавец или покупатель — кто заключил договор экспедиции). ГОЭксп = 0. Оговорка в подп. 2 стоит в конце фразы, поэтому возможно и иное прочтение; Минтранс (Q&A 4.7) читает так же. Если клиент сам получает груз (покупатель при самовывозе, перемещение своего груза — consignee_party: customer_itself), ГО = ГП и срабатывает R-107."

  - id: R-009
    layer: roles
    title: Груз без учёта ТМЦ или с сопровождающим представителем грузовладельца
