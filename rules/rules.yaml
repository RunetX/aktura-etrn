        url: *f520
        checked: 2026-09-23
    notes: "Позиция 1 (суд; Минтранс Q&A 2.4 по смыслу; по аналогии — суды округов, см. R-003: АС ДВО Ф03-2948/2017, АС ЗСО Ф04-115/2026 — доставка, организованная поставщиком, в т. ч. сверх цены и после перехода собственности при сдаче перевозчику, — часть поставки; дела о ж/д доставке через третьих лиц, а не своим транспортом): доставка — способ исполнения договора поставки, договора перевозки нет, ТрН не нужна. Позиция 2 (Минфин 2011): это услуга перевозки, нужна ТрН. Если право собственности перешло к покупателю до доставки, аргумент Минтранса «свой груз» не работает. С 01.03.2027 платная доставка на ТС тяжелее 3,5 т может потребовать допуска по 520-ФЗ (наш вывод из текста, позиции ведомства нет). Нормы или практики, решающей вопрос, нет; позиции изложены обе."

