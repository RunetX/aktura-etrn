    notes: "Аренда с экипажем — предоставление ТС и услуг экипажа, а не обязанность доставить и выдать груз (ГК 632); ТС во владении арендатора, он везёт свой груз — договора перевозки нет, ТрН подтверждать нечего (вывод из общих норм). Путевой лист оформляет арендодатель (Устав ст. 6 ч. 1). Спорно: прямой нормы, практики или позиции Минтранса/ФНС о ТрН при аренде с экипажем нет. Практика окружных судов отличает аренду от перевозки по признакам: передаётся ТС владельцу груза, а не груз перевозчику; предмет — владение и пользование, а не доставка и выдача груза получателю в срок; заказчик сам решает, как использовать ТС; подписан акт приёма-передачи ТС; плата за время, а не за рейс или объём (АС ДВО Ф03-3703/2018; АС СЗО А56-94808/2015; АС ВСО Ф02-1962/2025 — оплата по объёму сама по себе аренду не исключает). Если признаков перевозки больше — риск переквалификации (QUESTIONS №20). Если арендатор везёт ЧУЖОЙ груз по договору перевозки — перевозчик он (ГК 638 п. 2, Пленум № 26 п. 9), это hired_carrier."

