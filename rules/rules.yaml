        quote: "представитель (физическое лицо, индивидуальный предприниматель или иное юридическое лицо) […] электронный документ подписывается квалифицированной электронной подписью такого представителя юридического лица"
        url: *fz63_172
        checked: 2026-09-29
      - act: "63-ФЗ, ст. 17.2 ч. 1 п. 2 — доверенность и передоверие"
        quote: "В случае, если такая доверенность выдана в порядке передоверия, представляется также доверенность, допускающая возможность указанного передоверия"
        url: *fz63_172
        checked: 2026-09-29
