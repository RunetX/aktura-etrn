        url: *pp554
        checked: 2026-09-24
    notes: "Поручение состоит из файла клиента (направляется в ГИС первым), файла экспедитора о согласовании и, при необходимости, файла клиента об отзыве (ПП 469 прил. 1 пп. 3, 4). Клиент-физлицо или представитель по доверенности может подписать УНЭП; представитель юрлица или ИП — с машиночитаемой доверенностью (ПП 469 п. 13). ПП 554 п. 8 абз. 2 («на бумажном носителе, если иной способ не предусмотрен договором») текстуально не изменён, но с 01.09.2026 действует норма закона об электронной форме — вывод по иерархии актов, разъяснений нет. Поручение экспедитору — документ договора экспедиции (клиент и экспедитор); электронный заказ (заявка) — документ договора перевозки (грузоотправитель и перевозчик), это разные документы. В поручении обязательны реквизиты договора экспедиции — наименование, номер, дата; нет номера — «Без номера» (формат ФНС № ЕД-1-26/277@, прил. 1, `ДогТрЭксп`)."

  - id: R-202
    layer: fwd_docs
    title: "Экспедитор принимает груз — экспедиторская расписка, подписывает только экспедитор"
    when: { transport: forwarder, forwarder_takes_possession: yes }
    then: { forwarding_docs: eer }
    certainty: clear
    sources:
      - act: "87-ФЗ, ст. 4 п. 4.1 подп. 1 (в ред. 140-ФЗ)"
        quote: "выдать клиенту экспедиторскую расписку"
        url: *fz140
        checked: 2026-09-24
      - act: "ПП РФ № 469, прил. 2, п. 3"
        quote: "Такой файл обмена подписывается усиленной квалифицированной электронной подписью экспедитора."
        url: *pp469
        checked: 2026-09-24
      - act: "ПП РФ № 554 (Правила ТЭД), п. 12"
        quote: "выдается экспедитором клиенту при приеме груза"
        url: *pp554
        checked: 2026-09-24
      - act: "Приказ ФНС от 28.04.2026 № ЕД-1-26/277@ (формат ЭЭР), прил. 2, разд. I п. 2"
        quote: "Электронная экспедиторская расписка состоит из файла обмена информации экспедитора"
        url: http://publication.pravo.gov.ru/file/pdf?eoNumber=0001202605290005
        checked: 2026-09-25
    notes: "Расписка — один файл экспедитора; подписи клиента или отправителя в ней нет (ПП 469 прил. 2 п. 3; формат ФНС — единственный файл, подписант экспедитор). Участники обмена — только экспедитор и клиент (ПП 469 п. 2). Отправитель, который сдал груз экспедитору, но договор экспедиции не заключал, расписку не формирует и не подписывает: требование транспортной компании «экспедиторская расписка от отправителя» нормам не соответствует. Отправителя, сдавшего груз, в расписке и поручении укажут грузоотправителем: в формате ФНС это обязательный элемент — «лицо, предъявляющее груз к перевозке» (как ПП 554 п. 4); это не грузоотправитель по договору перевозки (ЭТрН). Бумажная расписка, которую ТК дают подписать при сдаче груза, вне случаев приказа № 115 электронную не заменяет (87-ФЗ ст. 2 п. 3). Если сдавший груз подписал документы ТК как клиент, он может стать стороной договора с ТК (Обзор ВС от 20.12.2017 п. 10; определение ВС от 05.09.2023 № 46-КГ23-9-К6)."

