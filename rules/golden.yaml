    source: { site: "nalog-nalog.ru, форум", url: "https://nalog-nalog.ru/forum/izmeneniya-2026/etrn-neskolko-scenariev/", date: 2026-08-28 }
    story: "Семь сценариев отправки через крупную ТК: продавец своим ТС до терминала (доставка в цене товара или за счёт покупателя); курьер ТК забирает у продавца по заказу продавца или покупателя; торговая компания вызывает курьера ТК к своему поставщику и отправляет сразу своему заказчику."
    question: "Какие документы на каждом этапе?"
    legs:
      - name: "Сц. 1: продавец своим ТС до терминала, доставка в цене товара"
        facts: { transport: own_seller, seller_paid_delivery: no }
        assumed: { international: no }
        expect: { rules: [], ask: [ownership_before_delivery] }
      - name: "Сц. 3А: курьер ТК забирает у продавца, заказ и оплата продавца"
        facts: { transport: hired_carrier, carriage_customer: seller }
        assumed: { international: no, tmc_accounting: yes, owner_escort: no }
        expect: { rules: [R-003], carriage_doc: etrn, roles: { shipper: seller }, form: electronic }
      - name: "Сц. 4: курьер ТК забирает у продавца, заказ и оплата покупателя"
        facts: { transport: hired_carrier, carriage_customer: buyer }
        assumed: { international: no, tmc_accounting: yes, owner_escort: no }
        expect: { rules: [R-004, R-107], carriage_doc: etrn, roles: { shipper: buyer, consignee: buyer, loader: seller }, form: paper_allowed }
      - name: "Сц. 6: торговая компания заказывает забор у своего поставщика и доставку своему заказчику"
        facts: { transport: hired_carrier, carriage_customer: buyer, consignee_party: customer_buyer }
        assumed: { international: no, tmc_accounting: yes, owner_escort: no }
        expect: { rules: [R-004], carriage_doc: etrn, roles: { shipper: buyer, consignee: third_party }, form: electronic }
    verdict: answer
    forum: contradicts
    notes: "Сц. 1–2 и 7 форум ответил так же (своим ТС — договора перевозки нет). Сц. 4 форум назвал ГО продавца — по Уставу ст. 2 ч. 1 п. 4 ГО тот, кто заключил договор перевозки (покупатель), продавец может подписать Т1 как ЛОП. Сц. 6 форум назвал экспедированием: торговая компания заключает договор перевозки от своего имени на свой груз, она ГО, ГП — её заказчик. Если ТК работает по договору экспедиции — роли по R-007/R-008. ЭЗЗ «обязателен» — не по норме (С4, PARKING)."
    gap: "Закрыто словарём 0.5: вариант «Транспортная компания» и вопрос tk_contract."
