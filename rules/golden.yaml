# Золотой набор: реальные ситуации с форумов (бриф §4 «Золотой набор», §9, §10 этап 1).
#
# Как читать:
# - source — площадка, ссылка, дата сообщения. Имена, ники, компании убраны; текст — пересказ.
#   Страницы открыты 2026-09-23. Ответы на форумах — НЕ источник правил, только материал для тестов.
# - facts — факты по словарю (VOCABULARY.md), которые прямо следуют из текста.
#   assumed — факты, которые в тексте не сказаны, но очевидны из контекста (продажа товара → учёт ТМЦ,
#   перевозка по РФ). Движок получает facts + assumed.
# - legs — если в ситуации несколько плеч перевозки, у каждого свои факты и ожидание.
# - expect — что возвращает движок по rules.yaml (проверяется так же, как tests.yaml).
#   ask — какие факты движок обязан спросить, если их нет.
# - verdict:
#     answer    — база правил даёт ответ (в т. ч. «спорно» — certainty: disputed);
#     ambiguous — «правила неоднозначны»: сценария нет в базе или нужна норма, которой нет в SOURCES.
# - forum — что ответили на форуме относительно нашего ответа: agrees | contradicts | split | none.
# - gap — чего не хватает базе правил; номер вопроса в QUESTIONS.md, если он заведён.
# - text_facts — для проверки ИИ-слоя (этап 3): факты, прямо сказанные в тексте, но не нужные
#   движку для ответа (или ситуация ambiguous). Движку не подаются; извлечь их — не ошибка,
#   извлечь другое значение — уверенная ошибка.
#
# before_start: true — сообщение раньше 01.09.2026; в счёт критерия «≥30 ситуаций» не идёт,
# добавлено ради сценариев, которых нет среди сентябрьских сообщений.

